name: Fill Excel product colors
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/inspect_excel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyze unfilled decor names
        run: python scripts/unresolved_report.py
      - name: Fill missing colors
        run: python scripts/fill_colors.py
      - name: Fill marketing decor names
        run: python scripts/marketing_colors.py
      - name: Correct Art East quoted decors
        run: python scripts/fix_art_east.py
      - name: Repair invalid colors and audit dimensions
        run: python scripts/repair_invalid_colors.py
      - name: Commit updated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.xlsx'
          if ! git diff --cached --quiet; then
            git commit -m "Fill missing product colors in Excel"
            git push
          fi
